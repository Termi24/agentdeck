name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tool count consistency
        # Locks in the v0.0.7 fix: tools.ts (TOOL_DEFINITIONS) ==
        # session-manager.ts (allowedTools) == install-claude.mjs (TOOL_NAMES).
        # Drift broke the bridge several times across v0.0.1→v0.0.7.
        run: pnpm check:tool-count

      - name: Typecheck (4 workspaces)
        run: pnpm typecheck
