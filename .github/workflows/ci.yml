name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tool count consistency
        # Locks in the v0.0.7 fix: tools.ts (TOOL_DEFINITIONS) ==
        # session-manager.ts (allowedTools) == install-claude.mjs (TOOL_NAMES).
        # Drift broke the bridge several times across v0.0.1→v0.0.7.
        run: pnpm check:tool-count

      - name: Typecheck (4 workspaces)
        run: pnpm typecheck

      - name: DB migrations (drizzle)
        run: pnpm db:migrate

      - name: Test-target dispatcher acceptance (v0.0.10+)
        # Boots the proxy in background, validates every process/test-targets/*.json
        # template loads, every campaign target can be created, every target-* methodology
        # section synthesizes, failure paths return crisp 4xx, and the legacy
        # Principe-10 backward-compat shim still produces the historical response shape.
        # Wall-clock ~30 s. Does not require ANTHROPIC_API_KEY (proxy-only).
        run: node scripts/acceptance-self-test.mjs
